# Mosquitto configuration for the local demo broker.
# Anonymous access is fine because this stack only listens on the compose
# network; for anything shared, set `allow_anonymous false`, add a
# `password_file` and use MQTT_USERNAME / MQTT_PASSWORD on the edge nodes.

listener 1883 0.0.0.0
allow_anonymous true

# Detections survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Broker log to stdout so `docker compose logs mosquitto` shows what is
# connecting, subscribing and (via $SYS) how fast traffic flows.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
